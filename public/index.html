<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Nómina</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { background: #2c3e50; color: white; padding: 20px; text-align: center; border-radius: 5px; margin-bottom: 30px; }
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        .menu { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; transition: background 0.3s; }
        .btn:hover { background: #2980b9; }
        .section { display: none; background: white; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .section.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f9f9f9; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Sistema de Nómina</h1>
            <p>Gestión integral de nómina de empleados</p>
        </header>

        <div class="menu">
            <button class="btn" onclick="showSection('dashboard')">📈 Dashboard</button>
            <button class="btn" onclick="showSection('employees')">👥 Empleados</button>
            <button class="btn" onclick="showSection('payroll')">💰 Nómina</button>
            <button class="btn" onclick="showSection('settings')">⚙️ Configuración</button>
        </div>

        <div id="dashboard" class="section active">
            <h2>Dashboard</h2>
            <div id="status" style="margin-top: 20px; padding: 15px; background: #ecf0f1; border-radius: 5px;">
                <p>Sistema operativo y funcionando correctamente</p>
            </div>
        </div>

        <div id="employees" class="section">
            <h2>Gestión de Empleados</h2>
            <button class="btn" onclick="toggleForm('newEmployee')">+ Nuevo Empleado</button>
            <div id="newEmployee" style="display:none; background: #ecf0f1; padding: 20px; border-radius: 5px; margin-bottom: 20px;">
                <h3>Agregar Nuevo Empleado</h3>
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="empNombre" placeholder="Juan">
                </div>
                <div class="form-group">
                    <label>Apellido</label>
                    <input type="text" id="empApellido" placeholder="Pérez">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="empEmail" placeholder="juan@empresa.com">
                </div>
                <div class="form-group">
                    <label>Salario</label>
                    <input type="number" id="empSalario" placeholder="25000">
                </div>
                <button class="btn" onclick="saveEmployee()">Guardar</button>
            </div>
        </div>

        <div id="payroll" class="section">
            <h2>Procesamiento de Nómina</h2>
            <button class="btn" onclick="processPayroll()">Procesar Nómina</button>
        </div>

        <div id="settings" class="section">
            <h2>Configuración</h2>
            <div class="form-group">
                <label>Nombre de Empresa</label>
                <input type="text" value="Mi Empresa">
            </div>
            <button class="btn" onclick="saveSettings()">Guardar</button>
        </div>
    </div>

    <script>
        function showSection(section) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(section).classList.add('active');
        }

        function toggleForm(id) {
            const form = document.getElementById(id);
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        function saveEmployee() {
            alert('Empleado guardado');
        }

        function processPayroll() {
            alert('Nómina procesada');
        }

        function saveSettings() {
            alert('Configuración guardada');
        }
    </script>
</body>
</html>
